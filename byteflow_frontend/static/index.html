<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ByteFlow</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a25;
    --accent: #4f8cff;
    --accent2: #7c4fff;
    --green: #00e5a0;
    --red: #ff4f6a;
    --yellow: #ffd94f;
    --text: #e8e8f0;
    --muted: #666680;
    --border: #2a2a3a;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; position: relative; }

  /* ── Header ── */
  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }
  #header .logo { display: flex; align-items: center; gap: 10px; }
  #header .logo .orb {
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--accent), var(--accent2));
    box-shadow: 0 0 14px rgba(79,140,255,0.5);
    animation: pulse 3s ease-in-out infinite;
  }
  #header .logo h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  #header .logo h1 span { color: var(--accent); }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); transition: background 0.3s;
  }
  #status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #status-dot.thinking { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); animation: blink 0.6s infinite; }
  #status-dot.error { background: var(--red); }
  #model-badge {
    font-size: 11px; color: var(--muted); background: var(--bg3);
    padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border);
  }

  /* ── Mode tabs ── */
  #modes {
    display: flex; gap: 6px; padding: 10px 14px 6px;
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  }
  #modes::-webkit-scrollbar { display: none; }
  .mode-btn {
    flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 13px;
    border: 1px solid var(--border); background: var(--bg3); color: var(--muted);
    cursor: pointer; transition: all 0.2s; font-family: var(--font);
  }
  .mode-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 0 12px rgba(79,140,255,0.35);
  }

  /* ── Messages ── */
  #messages {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; flex-direction: column; max-width: 88%; animation: fadeUp 0.25s ease; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot  { align-self: flex-start; align-items: flex-start; }
  .msg.system { align-self: center; align-items: center; max-width: 100%; }

  .bubble {
    padding: 10px 14px; border-radius: var(--radius); font-size: 14px;
    line-height: 1.55; word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bg3); color: var(--text);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
  }
  .msg.system .bubble {
    background: transparent; color: var(--muted); font-size: 12px;
    border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px;
  }
  .msg-time { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 4px; }

  /* Code blocks inside messages */
  .bubble pre {
    background: #0d0d15; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; margin-top: 8px; overflow-x: auto; font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .bubble code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }

  /* ── Thinking indicator ── */
  #thinking {
    display: none; align-self: flex-start;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); border-bottom-left-radius: 4px;
    padding: 12px 16px;
  }
  #thinking.show { display: flex; gap: 5px; align-items: center; animation: fadeUp 0.2s ease; }
  .dot-loader span {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); animation: dotBounce 1.2s ease-in-out infinite;
  }
  .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
  .dot-loader span:nth-child(3) { animation-delay: 0.4s; }

  /* ── Quick actions ── */
  #quick-actions {
    display: flex; gap: 8px; padding: 6px 14px;
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  }
  #quick-actions::-webkit-scrollbar { display: none; }
  .quick-btn {
    flex-shrink: 0; display: flex; align-items: center; gap: 5px;
    padding: 7px 13px; border-radius: 20px; font-size: 12px;
    border: 1px solid var(--border); background: var(--bg2); color: var(--muted);
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
    font-family: var(--font);
  }
  .quick-btn:hover { border-color: var(--accent); color: var(--text); }
  .quick-btn .icon { font-size: 13px; }

  /* ── Automation panel ── */
  #auto-panel {
    display: none; flex-direction: column;
    background: var(--bg2); border-top: 1px solid var(--border);
    max-height: 240px; overflow-y: auto; flex-shrink: 0;
  }
  #auto-panel.show { display: flex; }
  .auto-category { padding: 8px 14px 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .auto-task {
    padding: 9px 16px; font-size: 13px; cursor: pointer;
    border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 8px; transition: background 0.15s;
  }
  .auto-task:hover { background: var(--bg3); }
  .auto-task .task-name { color: var(--accent); font-family: monospace; font-size: 12px; }
  .auto-task .task-desc { color: var(--muted); font-size: 12px; }

  /* ── Input bar ── */
  #input-bar {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 14px 12px; border-top: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0;
  }
  #input-wrap { flex: 1; position: relative; }
  #input {
    width: 100%; min-height: 42px; max-height: 120px; resize: none;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 22px; padding: 11px 46px 11px 16px;
    font-size: 15px; color: var(--text); font-family: var(--font);
    outline: none; transition: border-color 0.2s; line-height: 1.4;
    scrollbar-width: none;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }

  #auto-toggle {
    position: absolute; right: 12px; bottom: 9px;
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-size: 18px; padding: 2px; transition: color 0.2s;
  }
  #auto-toggle.active { color: var(--accent); }

  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0; transition: all 0.15s;
  }
  #mic-btn {
    background: var(--bg3); color: var(--muted);
    border: 1px solid var(--border);
  }
  #mic-btn.recording {
    background: var(--red); color: #fff; border-color: var(--red);
    animation: pulse 1s ease-in-out infinite;
    box-shadow: 0 0 16px rgba(255,79,106,0.5);
  }
  #send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Animations ── */
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes dotBounce { 0%,80%,100% { transform: scale(0.8); opacity: 0.5; } 40% { transform: scale(1.2); opacity: 1; } }

  /* ── Voice wave ── */
  #voice-wave {
    display: none; position: absolute; bottom: 65px; left: 50%;
    transform: translateX(-50%); background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 20px; align-items: center; gap: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #voice-wave.show { display: flex; }
  .wave-bar {
    width: 3px; border-radius: 2px; background: var(--accent);
    animation: waveAnim 0.8s ease-in-out infinite;
  }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.2s; }
  .wave-bar:nth-child(6) { animation-delay: 0.1s; }
  @keyframes waveAnim { 0%,100% { height: 6px; } 50% { height: 24px; } }
  #voice-label { font-size: 12px; color: var(--muted); margin-left: 6px; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 8px 18px; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    white-space: nowrap; z-index: 100;
  }
  #toast.show { opacity: 1; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div class="logo">
      <div class="orb"></div>
      <h1>Byte<span>Flow</span></h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="model-badge">loading...</span>
      <div id="status-dot"></div>
    </div>
  </div>

  <!-- Mode tabs -->
  <div id="modes">
    <button class="mode-btn active" data-mode="run">⚡ Jarvis</button>
    <button class="mode-btn" data-mode="chat">💬 Chat</button>
    <button class="mode-btn" data-mode="code">🐍 Code</button>
    <button class="mode-btn" data-mode="search">🔍 Search</button>
    <button class="mode-btn" data-mode="automate">🤖 Automate</button>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="msg system">
      <div class="bubble">ByteFlow is running on your laptop → control from anywhere</div>
    </div>
  </div>

  <!-- Thinking -->
  <div id="thinking">
    <div class="dot-loader">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Quick actions -->
  <div id="quick-actions">
    <button class="quick-btn" onclick="sendQuick('What can you do?')"><span class="icon">🧠</span>Capabilities</button>
    <button class="quick-btn" onclick="sendQuick('system info')"><span class="icon">💻</span>System</button>
    <button class="quick-btn" onclick="sendQuick('git status .')"><span class="icon">🔀</span>Git Status</button>
    <button class="quick-btn" onclick="sendQuick('open vscode')"><span class="icon">⚡</span>VSCode</button>
    <button class="quick-btn" onclick="sendQuick('what time is it')"><span class="icon">🕐</span>Time</button>
    <button class="quick-btn" onclick="sendQuick('today weather')"><span class="icon">🌤</span>Weather</button>
  </div>

  <!-- Automation panel (hidden by default) -->
  <div id="auto-panel"></div>

  <!-- Voice wave overlay -->
  <div id="voice-wave">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <span id="voice-label">Listening…</span>
  </div>

  <!-- Input bar -->
  <div id="input-bar">
    <button class="icon-btn" id="mic-btn" title="Hold to speak">🎤</button>
    <div id="input-wrap">
      <textarea id="input" rows="1" placeholder="Ask ByteFlow anything…"></textarea>
      <button id="auto-toggle" title="Automation tasks">⚙️</button>
    </div>
    <button class="icon-btn" id="send-btn">➤</button>
  </div>

</div>
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let mode = 'run';
let ws = null;
let isRecording = false;
let recognition = null;
let autoTasksLoaded = false;
let autoPanelOpen = false;
const BASE = window.location.origin;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');
const micBtn     = document.getElementById('mic-btn');
const thinkingEl = document.getElementById('thinking');
const statusDot  = document.getElementById('status-dot');
const modelBadge = document.getElementById('model-badge');
const autoPanel  = document.getElementById('auto-panel');
const autoToggle = document.getElementById('auto-toggle');
const voiceWave  = document.getElementById('voice-wave');

// ── Init ──────────────────────────────────────────────────────────────────────
checkStatus();
connectWS();
setInterval(checkStatus, 30000);

// ── Status ────────────────────────────────────────────────────────────────────
async function checkStatus() {
  try {
    const r = await fetch(`${BASE}/api/status`);
    const d = await r.json();
    statusDot.className = 'online';
    modelBadge.textContent = d.model || 'byteflow';
    if (!autoTasksLoaded && d.automator_ready) loadAutoTasks();
  } catch {
    statusDot.className = 'error';
    modelBadge.textContent = 'offline';
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {};
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'thinking') setThinking(true);
    if (msg.event === 'response' || msg.event === 'automate_result') setThinking(false);
    if (msg.event === 'error') { setThinking(false); showToast('⚠ ' + msg.data.message); }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

// ── Mode tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;

    if (mode === 'automate') {
      autoPanel.classList.add('show');
      autoPanelOpen = true;
      autoToggle.classList.add('active');
      inputEl.placeholder = 'Search automation tasks…';
    } else {
      autoPanel.classList.remove('show');
      autoPanelOpen = false;
      autoToggle.classList.remove('active');
      const placeholders = {
        run: 'Ask ByteFlow anything…',
        chat: 'Chat with ByteFlow…',
        code: 'Describe the code you need…',
        search: 'Search the web…',
      };
      inputEl.placeholder = placeholders[mode] || 'Ask ByteFlow anything…';
    }
  });
});

// ── Auto-panel toggle ──────────────────────────────────────────────────────────
autoToggle.addEventListener('click', () => {
  autoPanelOpen = !autoPanelOpen;
  autoPanel.classList.toggle('show', autoPanelOpen);
  autoToggle.classList.toggle('active', autoPanelOpen);
});

// ── Load automation tasks ──────────────────────────────────────────────────────
async function loadAutoTasks() {
  try {
    const r = await fetch(`${BASE}/api/tasks`);
    const d = await r.json();
    autoTasksLoaded = true;
    renderAutoTasks(d.tasks);
  } catch {}
}

function renderAutoTasks(tasks) {
  const cats = {};
  tasks.forEach(t => { (cats[t.category] = cats[t.category] || []).push(t); });
  autoPanel.innerHTML = '';
  Object.entries(cats).forEach(([cat, items]) => {
    const h = document.createElement('div');
    h.className = 'auto-category'; h.textContent = cat;
    autoPanel.appendChild(h);
    items.forEach(t => {
      const el = document.createElement('div');
      el.className = 'auto-task';
      el.innerHTML = `<div>
        <div class="task-name">${t.name}</div>
        <div class="task-desc">${t.description}</div>
      </div>`;
      el.addEventListener('click', () => {
        inputEl.value = t.name + ' ';
        inputEl.focus();
        autoPanel.classList.remove('show');
        autoPanelOpen = false;
      });
      autoPanel.appendChild(el);
    });
  });
}

// Filter tasks as user types
inputEl.addEventListener('input', () => {
  if (mode === 'automate' && autoPanelOpen) {
    const q = inputEl.value.toLowerCase();
    autoPanel.querySelectorAll('.auto-task').forEach(el => {
      const name = el.querySelector('.task-name')?.textContent.toLowerCase() || '';
      const desc = el.querySelector('.task-desc')?.textContent.toLowerCase() || '';
      el.style.display = (name.includes(q) || desc.includes(q)) ? '' : 'none';
    });
  }
  autoResize();
});

// ── Send message ──────────────────────────────────────────────────────────────
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;

  appendMsg(text, 'user');
  inputEl.value = '';
  autoResize();
  sendBtn.disabled = true;
  setThinking(true);
  statusDot.className = 'thinking';

  try {
    if (mode === 'automate') {
      await sendAutomate(text);
    } else {
      await sendChat(text);
    }
  } catch (err) {
    appendMsg('⚠ Error: ' + err.message, 'system');
  } finally {
    setThinking(false);
    sendBtn.disabled = false;
    statusDot.className = 'online';
  }
}

async function sendChat(text) {
  const r = await fetch(`${BASE}/api/chat`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ message: text, mode }),
  });
  if (!r.ok) throw new Error(`Server error ${r.status}`);
  const d = await r.json();
  appendMsg(d.response, 'bot');
}

async function sendAutomate(text) {
  // Try direct task call first, then natural language
  const parts = text.split(/\s+/);
  const taskName = parts[0];

  const r = await fetch(`${BASE}/api/automate/nl`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ goal: text }),
  });
  const d = await r.json();
  const result = typeof d.result === 'object' ? JSON.stringify(d.result, null, 2) : d.result;
  const label = d.task ? `[${d.task}] ` : '';
  appendMsg(label + result, 'bot');
}

function sendQuick(text) {
  inputEl.value = text;
  send();
}

// ── Append message ────────────────────────────────────────────────────────────
function appendMsg(text, role) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatText(text);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  wrap.appendChild(bubble);
  wrap.appendChild(time);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function formatText(text) {
  if (typeof text !== 'string') text = JSON.stringify(text, null, 2);
  // Code blocks
  text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${escHtml(code.trim())}</code></pre>`);
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Newlines
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Thinking state ────────────────────────────────────────────────────────────
function setThinking(on) {
  thinkingEl.classList.toggle('show', on);
  if (on) messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── Voice input (Web Speech API) ──────────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = e => {
    let transcript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    inputEl.value = transcript;
    autoResize();
    if (e.results[e.results.length - 1].isFinal) {
      stopRecording();
      setTimeout(send, 300);
    }
  };

  recognition.onerror = () => stopRecording();
  recognition.onend = () => stopRecording();
}

micBtn.addEventListener('click', () => {
  if (!recognition) { showToast('Speech not supported in this browser'); return; }
  if (isRecording) stopRecording();
  else startRecording();
});

function startRecording() {
  isRecording = true;
  micBtn.classList.add('recording');
  voiceWave.classList.add('show');
  recognition.start();
}

function stopRecording() {
  isRecording = false;
  micBtn.classList.remove('recording');
  voiceWave.classList.remove('show');
  try { recognition.stop(); } catch {}
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}
</script>
</body>
</html>
