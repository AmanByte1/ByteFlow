<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteFlow Companion - Accelerated ⚡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 600px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.accelerated::before {
            content: "⚡";
        }

        .status-badge.standard::before {
            content: "⏱️";
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            padding: 0 4px;
        }

        .message.user .message-time {
            text-align: right;
        }

        .typing {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 20px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .response-time {
            font-size: 11px;
            color: #0a9f7a;
            margin-top: 4px;
            font-weight: 600;
        }

        .accelerated-badge {
            display: inline-block;
            background: #0a9f7a;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            background: white;
            display: flex;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex: 1;
            flex-direction: column;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input, textarea {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button.primary {
            background: #667eea;
            color: white;
        }

        button.primary:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        button.primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        button.secondary:hover {
            background: #e0e0e0;
        }

        .metrics {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        .metric {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .metric-value {
            font-weight: 600;
            color: #0a9f7a;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .success {
            background: #e8f8f5;
            border: 1px solid #b8e6d8;
            color: #0a9f7a;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>⚡ ByteFlow Companion</h1>
            <div class="status-bar">
                <div class="status-badge accelerated" id="statusBadge">
                    Accelerated Mode
                </div>
                <div id="speedometer" style="font-weight: 600;">5.2x Faster</div>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages">
            <div class="message bot">
                <div>
                    <div class="message-content">
                        👋 Welcome to ByteFlow Companion!<br>
                        <small>Powered by LocalAI Accelerator</small>
                    </div>
                    <div class="message-time">Just now</div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-group">
                <!-- Metrics -->
                <div class="metrics">
                    <div class="metric">
                        <span>Response Time:</span>
                        <span class="metric-value" id="responseTime">--ms</span>
                    </div>
                    <div class="metric">
                        <span>Status:</span>
                        <span class="metric-value" id="statusText">Ready</span>
                    </div>
                </div>

                <!-- Input Row -->
                <div class="input-row">
                    <input type="text" id="urlInput" placeholder="Enter URL..." maxlength="500">
                    <button class="primary" onclick="extractData()" id="extractBtn">
                        Extract
                    </button>
                </div>

                <!-- Company Input -->
                <div class="input-row">
                    <input type="text" id="companyInput" placeholder="Company name..." maxlength="200">
                    <button class="primary" onclick="validateLead()" id="validateBtn">
                        Validate
                    </button>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="secondary" onclick="refineData()">
                        Refine
                    </button>
                    <button class="secondary" onclick="clearMessages()">
                        Clear
                    </button>
                    <button class="secondary" onclick="getStatus()">
                        Status
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        let isProcessing = false;

        // ⚡ Fast message display
        function addMessage(text, isUser = false, responseTime = null, isAccelerated = false) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isUser ? 'user' : 'bot'}`;

            let contentHtml = `<div class="message-content">${escapeHtml(text)}`;
            
            if (responseTime !== null) {
                contentHtml += `<div class="response-time">⚡ ${responseTime}ms${isAccelerated ? '<span class="accelerated-badge">ACCELERATED</span>' : ''}</div>`;
            }
            
            contentHtml += '</div>';
            contentHtml += `<div class="message-time">${new Date().toLocaleTimeString()}</div>`;

            messageEl.innerHTML = contentHtml;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ⚡ Extract with acceleration
        async function extractData() {
            const url = document.getElementById('urlInput').value;
            const company = document.getElementById('companyInput').value;

            if (!url) {
                addMessage('❌ Please enter a URL', false);
                return;
            }

            isProcessing = true;
            updateStatus('Extracting...', true);
            document.getElementById('extractBtn').disabled = true;

            try {
                const startTime = performance.now();
                const response = await fetch(`${API_BASE}/api/extract`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, company })
                });

                const data = await response.json();
                const responseTime = Math.round(performance.now() - startTime);

                if (response.ok) {
                    addMessage(`✅ Extracted: ${url}\n${JSON.stringify(data.data, null, 2)}`, false, responseTime, data.accelerated);
                    updateStatus('Ready', false);
                    document.getElementById('responseTime').textContent = responseTime + 'ms';
                } else {
                    addMessage(`❌ Error: ${data.error}`, false);
                    updateStatus('Error', false);
                }
            } catch (error) {
                addMessage(`❌ Connection error: ${error.message}`, false);
                updateStatus('Error', false);
            } finally {
                isProcessing = false;
                document.getElementById('extractBtn').disabled = false;
            }
        }

        // ⚡ Validate with acceleration
        async function validateLead() {
            const url = document.getElementById('urlInput').value;
            const company = document.getElementById('companyInput').value;

            if (!company) {
                addMessage('❌ Please enter a company name', false);
                return;
            }

            isProcessing = true;
            updateStatus('Validating...', true);
            document.getElementById('validateBtn').disabled = true;

            try {
                const startTime = performance.now();
                const response = await fetch(`${API_BASE}/api/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: { company, url } })
                });

                const data = await response.json();
                const responseTime = Math.round(performance.now() - startTime);

                if (response.ok) {
                    const scoreColor = data.quality_score > 0.7 ? '🟢' : '🟡';
                    addMessage(`${scoreColor} Quality: ${(data.quality_score * 100).toFixed(0)}%\nStatus: ${data.status}`, false, responseTime, data.accelerated);
                    updateStatus('Ready', false);
                    document.getElementById('responseTime').textContent = responseTime + 'ms';
                } else {
                    addMessage(`❌ Error: ${data.error}`, false);
                }
            } catch (error) {
                addMessage(`❌ Connection error: ${error.message}`, false);
            } finally {
                isProcessing = false;
                document.getElementById('validateBtn').disabled = false;
            }
        }

        // ⚡ Refine with acceleration
        async function refineData() {
            const company = document.getElementById('companyInput').value;

            if (!company) {
                addMessage('❌ No data to refine', false);
                return;
            }

            isProcessing = true;
            updateStatus('Refining...', true);

            try {
                const startTime = performance.now();
                const response = await fetch(`${API_BASE}/api/refine`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: { company }, iterations: 2 })
                });

                const data = await response.json();
                const responseTime = Math.round(performance.now() - startTime);

                if (response.ok) {
                    addMessage(`✨ Refined (${data.iterations} passes)\n📈 Quality +${(data.quality_improvement * 100).toFixed(0)}%`, false, responseTime, data.accelerated);
                    updateStatus('Ready', false);
                    document.getElementById('responseTime').textContent = responseTime + 'ms';
                } else {
                    addMessage(`❌ Error: ${data.error}`, false);
                }
            } catch (error) {
                addMessage(`❌ Connection error: ${error.message}`, false);
            } finally {
                isProcessing = false;
            }
        }

        // Get status
        async function getStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                const data = await response.json();

                const statusMsg = `📊 System Status:\n` +
                    `Mode: ${data.mode.toUpperCase()}\n` +
                    `Speedup: ${data.speedup}\n` +
                    `Activities: ${data.activities}`;

                addMessage(statusMsg, false);
            } catch (error) {
                addMessage(`❌ Status error: ${error.message}`, false);
            }
        }

        // Helper functions
        function updateStatus(text, isProcessing) {
            document.getElementById('statusText').textContent = text;
            document.getElementById('statusBadge').style.opacity = isProcessing ? '0.7' : '1';
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            addMessage('👋 Chat cleared. Ready for new extraction!', false);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Enter key to send
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') extractData();
        });

        document.getElementById('companyInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') validateLead();
        });
    </script>
</body>
</html>
