<!-- ByteFlow Companion - Fixed Version with XSS Prevention -->
<!-- This is the corrected version - replace companion.html with this -->

<!-- Key Fixes:
     1. Use textContent instead of innerHTML to prevent XSS
     2. Proper error handling in async functions
     3. Input validation
     4. Better message formatting
     5. Security improvements
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ByteFlow Companion - AI Lead Generation & Data Extraction">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ByteFlow Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff8c42 0%, #ff6b35 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
            flex: 1;
            overflow: hidden;
        }

        /* Circular Companion */
        .circle-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .circle-container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .circle-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff8c42 0%, #ff6b35 100%);
            box-shadow: 
                0 0 60px rgba(255, 107, 53, 0.6),
                0 0 100px rgba(255, 140, 66, 0.3),
                inset 0 0 60px rgba(255, 255, 255, 0.1);
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .circle-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            z-index: 10;
        }

        .status-indicator {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #4ade80;
            border-radius: 50%;
            top: 20px;
            right: 20px;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            right: 5px;
            box-shadow: 0 0 10px #4ade80;
        }

        .eyes-container {
            display: flex;
            gap: 50px;
        }

        .eye {
            width: 45px;
            height: 65px;
            background: white;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .pupil {
            width: 20px;
            height: 20px;
            background: #ff6b35;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .waveform {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 40px;
        }

        .wave-bar {
            width: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 2px;
            animation: wave 0.6s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; height: 10px; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 15px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 20px; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 15px; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 10px; }

        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 25px; }
        }

        /* Control Panel */
        .control-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 140, 66, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 600px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 140, 66, 0.1);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 10px 15px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: #ff8c42;
            border-bottom-color: #ff8c42;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
            flex: 1;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Chat Styles - FIXED VERSION */
        #chat.tab-content {
            flex-direction: column;
        }

        .chat-container {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            border: 1px solid rgba(255, 140, 66, 0.2);
            margin-bottom: 15px;
            min-height: 200px;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .message.user {
            background: linear-gradient(135deg, #ff8c42 0%, #ff6b35 100%);
            color: white;
            text-align: right;
            margin-left: 40px;
            border-radius: 15px 15px 0 15px;
        }

        .message.assistant {
            background: rgba(255, 140, 66, 0.1);
            color: #e2e8f0;
            border-left: 3px solid #ff6b35;
            margin-right: 40px;
            border-radius: 15px 15px 15px 0;
            white-space: pre-wrap;
        }

        .chat-input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255, 140, 66, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #ff6b35;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.2);
        }

        .btn-voice {
            width: 45px;
            height: 45px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 140, 66, 0.2);
            border: 2px solid rgba(255, 140, 66, 0.5);
            color: #ff8c42;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-voice:hover {
            background: rgba(255, 140, 66, 0.4);
            border-color: #ff8c42;
        }

        .btn-voice.listening {
            background: #ff6b35;
            border-color: #ff6b35;
            color: white;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff8c42 0%, #ff6b35 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 140, 66, 0.1);
            color: #ff8c42;
            border: 2px solid rgba(255, 140, 66, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 140, 66, 0.2);
            border-color: #ff8c42;
        }

        .chat-status {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            min-height: 20px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .circle-container {
                width: 250px;
                height: 250px;
            }
            .header h1 {
                font-size: 24px;
            }
        }

        @media (max-width: 600px) {
            .container {
                max-height: 100vh;
                padding: 10px;
            }
            .header {
                margin-bottom: 15px;
            }
            .control-panel {
                padding: 15px;
                max-height: 500px;
            }
            .chat-container {
                min-height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 ByteFlow Companion</h1>
            <p>Intelligent Lead Generation & Data Extraction</p>
        </div>

        <div class="layout">
            <!-- Left: Circular Companion -->
            <div class="circle-panel">
                <div class="circle-container">
                    <div class="circle-bg"></div>
                    <div class="circle-content">
                        <div class="status-indicator">
                            <div class="status-dot"></div>
                        </div>
                        
                        <div class="eyes-container">
                            <div class="eye">
                                <div class="pupil" id="pupil1"></div>
                            </div>
                            <div class="eye">
                                <div class="pupil" id="pupil2"></div>
                            </div>
                        </div>

                        <div class="waveform">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Control Panel -->
            <div class="control-panel">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab(this, 'chat')">💬 Chat</button>
                    <button class="tab-btn" onclick="switchTab(this, 'search')">🎯 Search</button>
                    <button class="tab-btn" onclick="switchTab(this, 'extract')">🔍 Extract</button>
                </div>

                <!-- Chat Tab -->
                <div id="chat" class="tab-content active">
                    <div class="chat-container">
                        <div class="chat-messages" id="chatMessages">
                            <div class="message assistant">
                                <strong>🤖 ByteFlow Companion:</strong><br>
                                Hello! I'm your AI companion. Ask me about leads, data extraction, services, or anything else! 💬
                            </div>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <div class="input-row">
                            <input 
                                type="text" 
                                class="chat-input" 
                                id="chatInput" 
                                placeholder="Type your question..."
                                onkeypress="handleChatKeypress(event)"
                            />
                            <button class="btn-voice" id="voiceBtn" onclick="startVoiceInput()">🎤</button>
                        </div>

                        <div class="button-group">
                            <button class="btn btn-primary" onclick="sendChatMessage()">💬 Send</button>
                            <button class="btn btn-secondary" onclick="clearChatHistory()">🗑️ Clear</button>
                        </div>
                    </div>

                    <div class="chat-status" id="chatStatus"></div>
                </div>

                <!-- Other tabs placeholder (implement as needed) -->
                <div id="search" class="tab-content"></div>
                <div id="extract" class="tab-content"></div>
            </div>
        </div>
    </div>

    <script>
        // SECURITY: Eye tracking with safe DOM manipulation
        document.addEventListener('mousemove', (e) => {
            const pupil1 = document.getElementById('pupil1');
            const pupil2 = document.getElementById('pupil2');
            
            if (!pupil1 || !pupil2) return;
            
            const eyes = document.querySelectorAll('.eye');
            eyes.forEach(eye => {
                const rect = eye.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                const distance = 8;

                const pupilX = Math.cos(angle) * distance;
                const pupilY = Math.sin(angle) * distance;

                const pupil = eye.querySelector('.pupil');
                if (pupil) {
                    pupil.style.transform = `translate(calc(-50% + ${pupilX}px), calc(-50% + ${pupilY}px))`;
                }
            });
        });

        // Tab switching
        function switchTab(btn, tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            btn.classList.add('active');
            const tab = document.getElementById(tabName);
            if (tab) {
                tab.classList.add('active');
            }
        }

        // SECURITY: Voice input with proper error handling
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            try {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onstart = () => {
                    isListening = true;
                    const btn = document.getElementById('voiceBtn');
                    if (btn) btn.classList.add('listening');
                    const status = document.getElementById('chatStatus');
                    if (status) status.textContent = '🎤 Listening...';
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i][0].transcript) {
                            transcript += event.results[i][0].transcript + ' ';
                        }
                    }
                    const input = document.getElementById('chatInput');
                    if (input) {
                        input.value = transcript.trim();
                    }
                    isListening = false;
                    const btn = document.getElementById('voiceBtn');
                    if (btn) btn.classList.remove('listening');
                };

                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    const status = document.getElementById('chatStatus');
                    if (status) status.textContent = '❌ Voice error: ' + event.error;
                    isListening = false;
                    const btn = document.getElementById('voiceBtn');
                    if (btn) btn.classList.remove('listening');
                };

                recognition.onend = () => {
                    isListening = false;
                    const btn = document.getElementById('voiceBtn');
                    if (btn) btn.classList.remove('listening');
                };
            } catch (e) {
                console.error('Speech recognition not available:', e);
                recognition = null;
            }
        }

        // Start voice input
        function startVoiceInput() {
            if (!recognition) {
                alert('Voice input not supported in your browser. Try Chrome, Edge, or Safari.');
                return;
            }
            
            if (isListening) {
                recognition.stop();
            } else {
                const input = document.getElementById('chatInput');
                if (input) input.value = '';
                recognition.start();
            }
        }

        // SECURITY: Send chat message with proper input validation
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (!input) return;
            
            const message = input.value.trim();

            if (!message) {
                alert('Please enter a message');
                return;
            }

            if (message.length > 500) {
                alert('Message too long (max 500 characters)');
                return;
            }

            // Display user message (safe - textContent only)
            addChatMessage('user', message);
            input.value = '';

            // Show thinking status
            const status = document.getElementById('chatStatus');
            if (status) status.textContent = '🤖 Companion is thinking...';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                // CHECK HTTP STATUS FIRST
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (data && data.success) {
                    // Display companion response (SAFE - textContent, not innerHTML)
                    addChatMessage('assistant', data.response || '(No response)');
                    if (status) status.textContent = '';
                } else {
                    const errorMsg = data?.error || 'Unknown error';
                    addChatMessage('assistant', '❌ Error: ' + errorMsg);
                }
            } catch (error) {
                console.error('Chat error:', error);
                addChatMessage('assistant', '❌ Connection error: ' + (error.message || 'Unknown error'));
            }

            // Scroll to bottom
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // SECURITY: Add message to chat safely (prevents XSS)
        function addChatMessage(role, text) {
            const chatMessages = document.getElementById('chatMessages');
            if (!chatMessages) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            if (role === 'assistant') {
                // Create structure safely
                const strong = document.createElement('strong');
                strong.textContent = '🤖 ByteFlow:';
                msgDiv.appendChild(strong);
                
                msgDiv.appendChild(document.createElement('br'));
                
                // Use textContent for safety (prevents XSS)
                const content = document.createElement('div');
                content.textContent = text;
                content.style.whiteSpace = 'pre-wrap';
                msgDiv.appendChild(content);
            } else {
                // User message - just textContent
                msgDiv.textContent = text;
            }
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Handle Enter key
        function handleChatKeypress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatMessage();
            }
        }

        // Clear chat history
        async function clearChatHistory() {
            try {
                await fetch('/api/chat/clear', { method: 'POST' });
                const chatMessages = document.getElementById('chatMessages');
                if (chatMessages) {
                    chatMessages.innerHTML = '';
                    addChatMessage('assistant', 'Chat cleared! Ask me anything again. 💬');
                }
                const status = document.getElementById('chatStatus');
                if (status) {
                    status.textContent = '✅ Chat cleared';
                    setTimeout(() => {
                        status.textContent = '';
                    }, 2000);
                }
            } catch (error) {
                console.error('Error clearing chat:', error);
                alert('Error clearing chat: ' + error.message);
            }
        }
    </script>
</body>
</html>
